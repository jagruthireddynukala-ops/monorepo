name: Employee Leave Management CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  NODE_VERSION: "24"
  API_FOLDER: "api"
  UI_FOLDER: "ui"
  INFRA_FOLDER: "infra"

jobs:

  # ============================================================
  # 1. BUILD API
  # ============================================================
  build-api:
    name: Build API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Build API
        run: npm run build

      - name: Create API package
        run: |
          zip -r ../api.zip . \
            -x "node_modules/*"

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: api.zip


  # ============================================================
  # 2. BUILD UI
  # ============================================================
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

      - name: Upload UI
        uses: actions/upload-artifact@v4
        with:
          name: ui-package
          path: ui/


  # ============================================================
  # 3. TERRAFORM INFRASTRUCTURE
  # ============================================================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    needs:
      - build-api
      - build-ui

    defaults:
      run:
        working-directory: infra

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -auto-approve


  # ============================================================
  # 4. DEPLOY API
  # ============================================================
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest

    needs:
      - terraform
      - build-api

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.API_APP_NAME }}
          package: api.zip


  # ============================================================
  # 5. DEPLOY UI
  # ============================================================
  deploy-ui:
    name: Deploy UI
    runs-on: ubuntu-latest

    needs:
      - terraform
      - build-ui

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-package
          path: ui

      - name: Deploy UI to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.UI_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "ui/public"
          output_location: ""
          skip_app_build: true