<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Leave Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Employee Leave Management</h1>
        <p>Apply and manage employee leave requests</p>
    </header>

    <section class="dashboard">
        <div class="card">
            <h3>Total Employees</h3>
            <strong id="totalEmployees">0</strong>
        </div>

        <div class="card">
            <h3>Total Leaves</h3>
            <strong id="totalLeaves">0</strong>
        </div>

        <div class="card">
            <h3>Pending</h3>
            <strong id="pendingLeaves">0</strong>
        </div>

        <div class="card">
            <h3>Approved</h3>
            <strong id="approvedLeaves">0</strong>
        </div>

        <div class="card">
            <h3>Rejected</h3>
            <strong id="rejectedLeaves">0</strong>
        </div>
    </section>

    <section class="panel">
        <h2>Apply for Leave</h2>

        <div id="message"></div>

        <form id="leaveForm">

            <div class="form-grid">
                <div>
                    <label for="employeeName">Employee Name</label>
                    <input
                        type="text"
                        id="employeeName"
                        placeholder="Enter employee name"
                        required
                    >
                </div>

                <div>
                    <label for="employeeUniqueId">Unique ID</label>
                    <input
                        type="text"
                        id="employeeUniqueId"
                        placeholder="Example: EMP001"
                        required
                    >
                </div>

                <div>
                    <label for="leaveType">Leave Type</label>
                    <select id="leaveType" required>
                        <option value="">Select leave type</option>
                        <option value="Casual Leave">Casual Leave</option>
                        <option value="Sick Leave">Sick Leave</option>
                        <option value="Earned Leave">Earned Leave</option>
                        <option value="Emergency Leave">Emergency Leave</option>
                    </select>
                </div>

                <div>
                    <label for="fromDate">From Date</label>
                    <input type="date" id="fromDate" required>
                </div>

                <div>
                    <label for="toDate">To Date</label>
                    <input type="date" id="toDate" required>
                </div>

                <div class="full-width">
                    <label for="reason">Reason</label>
                    <textarea
                        id="reason"
                        rows="4"
                        placeholder="Enter reason for leave"
                        required
                    ></textarea>
                </div>
            </div>

            <button type="submit">Submit Leave Request</button>
        </form>
    </section>

    <section class="panel">
        <h2>Leave Requests</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Employee</th>
                        <th>Unique ID</th>
                        <th>Leave Type</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="leaveTableBody">
                    <tr>
                        <td colspan="9">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

<script src="app.js"></script>
</body>
</html>
